name: PR sync check (up to date with main)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to update and check (blank = update all behind-PRs)'
        required: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR is up to date with main — auto-update or flag conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const STATUS_CONTEXT = 'pr-sync/up-to-date-with-main';
            const prNumberInput = context.payload.inputs?.pr_number;

            let prs;
            if (prNumberInput) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(prNumberInput) });
              prs = [pr];
            } else if (context.eventName === 'pull_request') {
              prs = [context.payload.pull_request];
            } else {
              // main just moved — every open PR may now be behind, re-check all of them.
              const res = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'main', per_page: 100 });
              prs = res.data;
            }

            let conflicted = [];

            for (const pr of prs) {
              if (pr.base.ref !== 'main' || pr.draft) continue;

              const headSha = pr.head.sha;

              // Post pending immediately so the PR merge box moves from
              // "Expected — Waiting" to a visible status right away.
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, state: 'pending',
                context: STATUS_CONTEXT,
                description: 'جارٍ التحقق من التزامن مع main…',
              });

              try {
                const { data: compare } = await github.rest.repos.compareCommits({
                  owner, repo, base: headSha, head: 'main',
                });

                if (compare.ahead_by === 0) {
                  await github.rest.repos.createCommitStatus({
                    owner, repo, sha: headSha, state: 'success',
                    context: STATUS_CONTEXT,
                    description: 'متزامن مع main ✅',
                  });
                  console.log(`PR #${pr.number}: up to date.`);
                } else {
                  console.log(`PR #${pr.number} is ${compare.ahead_by} commit(s) behind main — attempting auto-update.`);
                  try {
                    await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
                    // updateBranch pushes a merge commit which fires a fresh "synchronize"
                    // event — that re-run will report success on the new head SHA.
                    // Mark the current SHA as success too so the merge box clears now.
                    await github.rest.repos.createCommitStatus({
                      owner, repo, sha: headSha, state: 'success',
                      context: STATUS_CONTEXT,
                      description: 'تم التحديث من main تلقائياً ✅',
                    });
                    console.log(`PR #${pr.number}: auto-updated from main.`);
                  } catch (err) {
                    // 422 = real merge conflict; anything else = permission/transient issue.
                    const isConflict = err.status === 422;
                    await github.rest.repos.createCommitStatus({
                      owner, repo, sha: headSha, state: 'failure',
                      context: STATUS_CONTEXT,
                      description: isConflict
                        ? 'تعارضات مع main — يجب حلّها يدوياً ⚠️'
                        : `متأخر ${compare.ahead_by} commit عن main — اضغط "Update branch" ❌`,
                    });
                    console.error(`PR #${pr.number}: could not auto-update (${err.status}: ${err.message}).`);
                  }
                }
              } catch (err) {
                // Unexpected error (e.g. API failure) — surface it as a visible failure
                // rather than leaving the status as "Expected".
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: headSha, state: 'failure',
                  context: STATUS_CONTEXT,
                  description: `خطأ أثناء التحقق: ${err.message}`,
                });
                console.error(`PR #${pr.number}: unexpected error: ${err.message}`);
              }

              // Only relevant when a single PR was targeted via workflow_dispatch:
              // confirm GitHub sees no conflicts after the update has landed.
              if (prNumberInput) {
                let mergeable = null;
                for (let i = 0; i < 5 && mergeable === null; i++) {
                  if (i > 0) await new Promise(r => setTimeout(r, 3000));
                  const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                  mergeable = fresh.mergeable;
                }
                if (mergeable === false) {
                  conflicted.push(pr.number);
                }
              }
            }

            if (conflicted.length > 0) {
              core.setFailed(`PR(s) have merge conflicts with main and cannot be merged: ${conflicted.join(', ')}`);
            }
